name: Build YWPC Release

on:
  push:
    branches:
      - ywpc-actions-release
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.arch }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64
    steps:
      - name: Checkout customized package sources
        shell: bash
        run: git clone --depth 1 --branch ywpc-custom-bootstrap https://github.com/100pangci/termux-packages.git termux-packages

      - name: Build custom-prefix Bootstrap
        shell: bash
        working-directory: termux-packages
        env:
          CONTAINER_NAME: termux-ywpc-${{ matrix.arch }}-${{ github.run_id }}
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERMUX_PKG_MAKE_PROCESSES=4
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh -f --add openssh --architectures "${{ matrix.arch }}"

      - name: Upload Bootstrap archive
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}
          path: termux-packages/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and sign APKs
    needs: bootstrap
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout app source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Bootstrap archives
        uses: actions/download-artifact@v8
        with:
          pattern: bootstrap-*
          merge-multiple: true
          path: bootstrap

      - name: Verify OpenSSH in Bootstrap archives
        shell: bash
        run: |
          for arch in aarch64 arm i686 x86_64; do
            archive="bootstrap/bootstrap-${arch}.zip"
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing Bootstrap archive: $archive"
              exit 1
            fi
            entries="$(unzip -Z1 "$archive")"
            symlinks="$(unzip -p "$archive" SYMLINKS.txt)"
            for executable in ssh ssh-add ssh-agent ssh-keygen sshd; do
              path="bin/$executable"
              if ! grep -Fxq "$path" <<<"$entries" && ! grep -Fq "←./$path" <<<"$symlinks"; then
                echo "::error::Bootstrap $arch is missing OpenSSH executable $path"
                exit 1
              fi
            done
          done

      - name: Configure release signing
        shell: bash
        env:
          TERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          TERMUX_RELEASE_KEY_ALIAS: termux-ywpc-release
          TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
        run: |
          for name in TERMUX_RELEASE_KEYSTORE_BASE64 TERMUX_RELEASE_STORE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Actions secret: ${name}"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/termux-ywpc-release.p12"
          umask 077
          printf '%s' "$TERMUX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          test -s "$key"
          keytool -list -keystore "$key" -alias "$TERMUX_RELEASE_KEY_ALIAS" \
            -storepass:env TERMUX_RELEASE_STORE_PASSWORD >/dev/null

      - name: Build signed ABI APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_BOOTSTRAP_DIR: ${{ github.workspace }}/bootstrap
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TERMUX_RELEASE_KEYSTORE: ${{ runner.temp }}/termux-ywpc-release.p12
          TERMUX_RELEASE_KEY_ALIAS: termux-ywpc-release
          TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signatures and generate checksums
        shell: bash
        run: |
          apk_dir=app/build/outputs/apk/release
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_dir/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | sed -n '$p')"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner was not found"
            exit 1
          fi
          files=()
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk="$apk_dir/termux-app_apt-android-7-release_${abi}.apk"
            if [[ ! -s "$apk" ]]; then
              echo "::error::Missing release APK: $apk"
              exit 1
            fi
            "$apksigner" verify --print-certs "$apk"
            files+=("$(basename "$apk")")
          done
          (cd "$apk_dir" && sha256sum "${files[@]}" > SHA256SUMS)

      - name: Stop Gradle daemons
        if: always()
        shell: bash
        run: ./gradlew --stop || true

      - name: Remove signing keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/termux-ywpc-release.p12"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: termux-ywpc-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/termux-app_apt-android-7-release_*.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
